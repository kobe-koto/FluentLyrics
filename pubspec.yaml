name: fluent_lyrics
description: "Fluent Lyrics, a lyrics viewer supports various sources."

version: 0.0.50+50

publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  scrollable_positioned_list: ^0.3.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.1
  dbus: ^0.8.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  async: ^2.13.0
  ffi: ^2.1.4
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  html_unescape: ^2.0.0
  wakelock_plus: ^1.8.0
  string_similarity: ^2.0.0
  xml: ^6.5.0
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  palette_generator_plus: ^1.0.0
  url_launcher: ^6.3.2
  hooks: ^2.0.2
  code_assets: ^2.1.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  slang_build_runner: ^4.19.0

flutter:
  uses-material-design: true

  assets:
    - assets/album_art_512.webp
    - assets/icons/logo-rounded.png
    - assets/fonts/Outfit/OFL.txt
    # Generated by tool/sync_opencc_assets.sh (OpenCC configs + dictionaries).
    - assets/opencc/
    # Generated by tool/sync_kanji_readings.sh (trimmed KANJIDIC2 readings).
    - assets/kanji_readings/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/VariableFont_wght.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icons/adaptive_icon_background.png"
  adaptive_icon_foreground: "assets/icons/adaptive_icon_foreground.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icons/adaptive_icon_foreground.png"
