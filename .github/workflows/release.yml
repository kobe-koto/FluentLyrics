name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What should this manual run do?'
        required: true
        type: choice
        default: 'Build Only'
        options:
          - 'Release Unstable'
          - 'Build Only'
      build_linux:
        description: 'Build Linux artifacts in Build Only mode'
        required: false
        type: boolean
        default: true
      build_android:
        description: 'Build Android artifacts in Build Only mode'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS artifacts in Build Only mode'
        required: false
        type: boolean
        default: true

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_version: ${{ steps.version.outputs.release_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "Build Only" ]; then
            if [ "${{ inputs.build_linux }}" != "true" ] && [ "${{ inputs.build_android }}" != "true" ] && [ "${{ inputs.build_macos }}" != "true" ]; then
              echo "Build Only requires at least one selected platform." >&2
              exit 1
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest_tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-r*')"
            latest_version="${latest_tag#v}"
            version_code="${latest_version#*+}"
            if [ "$version_code" = "$latest_version" ]; then
              version_code=""
            fi

            version_name="$(git describe --long --tags --match 'v*' --exclude 'v*-r*' | sed -E 's/^v//;s/\+[0-9]+//;s/-([0-9]+)-g/-r\1.g/')"
            build_version="$version_name"
            if [ -n "$version_code" ]; then
              build_version="$version_name+$version_code"
            fi

            release_version="v$version_name"
            prerelease="true"
          else
            build_version="${{ github.ref_name }}"
            version_string="${build_version#v}"
            version_name="${version_string%%+*}"
            version_code="${version_string#*+}"
            if [ "$version_code" = "$version_string" ]; then
              version_code=""
            fi
            release_version="${{ github.ref_name }}"
            prerelease="false"
          fi

          {
            echo "build_version=$build_version"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "release_version=$release_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare-version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'Release Unstable' || inputs.build_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config zip libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version="${VERSION#v}"
          VERSION="$version" perl -0pi -e 's/^version: .*/version: $ENV{VERSION}/m' pubspec.yaml

      - name: Build Linux
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          flutter build linux --release
          version_string="${RELEASE_VERSION#v}"
          version_name="${version_string%%+*}"
          bundle_dir="$(find build/linux -type d -path '*/release/bundle' -print -quit)"
          [ -n "$bundle_dir" ] && [ -d "$bundle_dir" ] || {
            echo "Linux bundle was not produced." >&2
            exit 1
          }
          mkdir -p dist
          (
            cd "$bundle_dir"
            zip -qr "$GITHUB_WORKSPACE/dist/fluent_lyrics-${version_name}-linux-${TARGET_ARCH}.zip" .
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-dist-${{ matrix.arch }}
          path: dist/**/*

  build-android:
    needs: prepare-version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'Release Unstable' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version="${VERSION#v}"
          VERSION="$version" perl -0pi -e 's/^version: .*/version: $ENV{VERSION}/m' pubspec.yaml

      - name: Decode Keystore for Android build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Build Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
        run: |
          flutter build apk --release --split-per-abi

      - name: Normalize Android artifact names
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          bash ./tool/normalize-artifacts/android.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-dist
          path: dist/**/*

  build-macos:
    needs: prepare-version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'Release Unstable' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version="${VERSION#v}"
          VERSION="$version" perl -0pi -e 's/^version: .*/version: $ENV{VERSION}/m' pubspec.yaml

      - name: Prepare MediaRemote adapter
        run: ./tool/macos_prepare_mediaremote_adapter.sh

      - name: Build macOS
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          flutter build macos --release
          version_string="${RELEASE_VERSION#v}"
          version_name="${version_string%%+*}"
          app_path="build/macos/Build/Products/Release/Fluent Lyrics.app"
          [ -d "$app_path" ] || {
            echo "macOS app bundle was not produced." >&2
            exit 1
          }
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/fluent_lyrics-${version_name}-macos.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: dist/**/*

  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'Release Unstable' }}
    needs:
      - prepare-version
      - build-linux
      - build-android
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create unstable tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'Release Unstable' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            existing_commit="$(git rev-list -n 1 "$RELEASE_VERSION")"
            current_commit="$(git rev-parse HEAD)"
            if [ "$existing_commit" != "$current_commit" ]; then
              echo "Tag $RELEASE_VERSION already exists at $existing_commit, expected $current_commit." >&2
              exit 1
            fi
            echo "Tag $RELEASE_VERSION already exists at current commit."
          else
            git tag "$RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.release_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare-version.outputs.prerelease }}
        run: |
          bash ./tool/generate-release-notes.sh

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_version }}
          prerelease: ${{ needs.prepare-version.outputs.prerelease }}
          body_path: release.md
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install F-Droid server tools
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/fdroidserver-venv"
          "$RUNNER_TEMP/fdroidserver-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/fdroidserver-venv/bin/pip" install --upgrade fdroidserver androguard
          echo "$RUNNER_TEMP/fdroidserver-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fdroidserver-venv/bin/fdroid" --version

      - name: Generate F-Droid repository
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
          FDROID_REPO_KEY_PASSWORD: ${{ secrets.FDROID_REPO_KEY_PASSWORD }}
        run: |
          cp -a fdroid-config fdroid-work
          mkdir -p fdroid-work/repo fdroid-public

          find dist -type f -name 'fluent_lyrics-*-android-*.apk' -exec cp '{}' fdroid-work/repo/ ';'
          apk_count="$(find fdroid-work/repo -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No Android APKs found in dist for F-Droid repository" >&2
            exit 1
          fi

          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 --decode > fdroid-work/fdroid-repo.jks

          cat >> fdroid-work/config.yml <<EOF

          keystore: fdroid-repo.jks
          repo_keyalias: $FDROID_REPO_KEY_ALIAS
          keystorepass: $FDROID_REPO_KEYSTORE_PASSWORD
          keypass: $FDROID_REPO_KEY_PASSWORD
          EOF
          chmod 600 fdroid-work/config.yml fdroid-work/fdroid-repo.jks

          cd fdroid-work
          fdroid update --create-metadata --verbose
          cd ..
          cp -a fdroid-work/repo fdroid-public/repo

      - name: Publish F-Droid repository to GitHub Pages
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: static-page
          publish_dir: ./fdroid-public
          destination_dir: fdroid
          keep_files: true
        
