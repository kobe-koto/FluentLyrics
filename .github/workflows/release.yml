name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_version: ${{ steps.version.outputs.release_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest_tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-r*')"
            latest_version="${latest_tag#v}"
            version_code="${latest_version#*+}"
            if [ "$version_code" = "$latest_version" ]; then
              version_code=""
            fi

            version_name="$(git describe --long --tags --match 'v*' --exclude 'v*-r*' | sed -E 's/^v//;s/\+[0-9]+//;s/-([0-9]+)-g/-r\1.g/')"
            build_version="$version_name"
            if [ -n "$version_code" ]; then
              build_version="$version_name+$version_code"
            fi

            release_version="v$version_name"
            prerelease="true"
          else
            build_version="${{ github.ref_name }}"
            version_string="${build_version#v}"
            version_name="${version_string%%+*}"
            version_code="${version_string#*+}"
            if [ "$version_code" = "$version_string" ]; then
              version_code=""
            fi
            release_version="${{ github.ref_name }}"
            prerelease="false"
          fi

          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build-linux-android:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev locate libfuse2 libayatana-appindicator3-dev

      - name: Install AppImage tool
        run: |
          wget -nv -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: ${{ needs.prepare-version.outputs.prerelease }}

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Add path
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version="${VERSION#v}"
          VERSION="$version" perl -0pi -e 's/^version: .*/version: $ENV{VERSION}/m' pubspec.yaml

      - name: Decode Keystore for Android build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Build Linux and Android
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
        run: |
          fastforge release --name production --skip-jobs=release-macos-zip

      - name: Normalize Android artifact names
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          bash ./.github/normalize-artifacts-android.sh

      - name: Upload Linux and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-dist
          path: dist/**/*

  build-macos:
    needs: prepare-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: ${{ needs.prepare-version.outputs.prerelease }}

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Add path
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version="${VERSION#v}"
          VERSION="$version" perl -0pi -e 's/^version: .*/version: $ENV{VERSION}/m' pubspec.yaml

      - name: Build macOS
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: fastforge release --name production --jobs=release-macos-zip

      - name: Normalize macOS artifact names
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.build_version }}
        run: |
          version_string="${RELEASE_VERSION#v}"
          version_name="${version_string%%+*}"
          dist_dir="dist/$version_string"
          if [ ! -d "$dist_dir" ] && [ -d dist ]; then
            dist_dir="$(find dist -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          fi
          [ -n "$dist_dir" ] && [ -d "$dist_dir" ] || exit 0

          for artifact in "$dist_dir"/*; do
            [ -e "$artifact" ] || continue
            filename="$(basename "$artifact")"
            target="$dist_dir/${filename//$version_string/$version_name}"
            if [ "$target" != "$artifact" ]; then
              mv "$artifact" "$target"
            fi
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/**/*

  release:
    needs:
      - prepare-version
      - build-linux-android
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Release Notes
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.release_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare-version.outputs.prerelease }}
        run: |
          bash ./.github/generate-release-notes.sh

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_version }}
          prerelease: ${{ needs.prepare-version.outputs.prerelease }}
          body_path: release.md
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install F-Droid server tools
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/fdroidserver-venv"
          "$RUNNER_TEMP/fdroidserver-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/fdroidserver-venv/bin/pip" install --upgrade fdroidserver androguard
          echo "$RUNNER_TEMP/fdroidserver-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fdroidserver-venv/bin/fdroid" --version

      - name: Generate F-Droid repository
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
          FDROID_REPO_KEY_PASSWORD: ${{ secrets.FDROID_REPO_KEY_PASSWORD }}
          FDROID_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fdroid/repo
        run: |
          mkdir -p fdroid-work/repo fdroid-public

          find dist -type f -name 'fluent_lyrics-*-android.apk' -exec cp '{}' fdroid-work/repo/ ';'
          apk_count="$(find fdroid-work/repo -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No Android APKs found in dist for F-Droid repository" >&2
            exit 1
          fi

          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 --decode > fdroid-work/fdroid-repo.jks

          cat > fdroid-work/config.yml <<EOF
          repo_url: $FDROID_REPO_URL
          repo_name: FluentLyrics
          repo_description: Custom F-Droid repository for FluentLyrics Android releases.

          keystore: fdroid-repo.jks
          repo_keyalias: $FDROID_REPO_KEY_ALIAS
          keystorepass: $FDROID_REPO_KEYSTORE_PASSWORD
          keypass: $FDROID_REPO_KEY_PASSWORD
          EOF
          chmod 600 fdroid-work/config.yml fdroid-work/fdroid-repo.jks

          cd fdroid-work
          fdroid update --create-metadata --verbose
          cd ..
          cp -a fdroid-work/repo fdroid-public/repo

      - name: Publish F-Droid repository to GitHub Pages
        if: ${{ needs.prepare-version.outputs.prerelease != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: static-page
          publish_dir: ./fdroid-public
          destination_dir: fdroid
          keep_files: true
        
