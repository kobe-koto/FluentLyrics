name: Test

on:
  push:
    tags-ignore:
      - '*'
  pull_request:
  workflow_call:

jobs:
  # Also the source of the `kanji-readings` artifact the platform builds in
  # release.yml download, since release.yml calls this workflow first.
  kanji-readings:
    uses: ./.github/workflows/prepare-kanji-readings.yml

  test:
    needs: kanji-readings
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libgtk-3-0 libblkid1 liblzma5

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: stable
          cache: true

      - name: Get flutter dependencies
        run: flutter pub get

      - name: Sync OpenCC assets
        run: ./tool/sync_opencc_assets.sh

      - name: Download kanji readings
        uses: actions/download-artifact@v8
        with:
          name: kanji-readings
          path: assets/kanji_readings

      - name: Run tests
        run: flutter test
