output: dist/
releases:
  - name: production
    jobs:
      - name: release-linux-zip
        package:
          platform: linux
          target: zip
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
      - name: release-android
        package:
          platform: android
          target: apk
          build_args:
            split-per-abi:
      - name: release-macos-zip
        package:
          platform: macos
          target: zip
