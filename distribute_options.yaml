output: dist/
releases:
  - name: production
    jobs:
      - name: release-linux-zip
        package:
          platform: linux
          target: zip
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
      # Fastforge builds Linux bundles for the native runner architecture.
      # This job is run on the ARM64 GitHub runner by the release workflow.
      - name: release-linux-arm64-zip
        package:
          platform: linux
          target: zip
      - name: release-android
        package:
          platform: android
          target: apk
          build_args:
            split-per-abi:
      - name: release-macos-zip
        package:
          platform: macos
          target: zip
